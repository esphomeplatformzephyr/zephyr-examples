esphome:
  name: nsim-i2c-emulation-ex

zephyr:
  variant: nativesim
  advanced:
    mac_address: "62:23:45:AF:B3:DE"

logger:
  level: VERBOSE

network:

api:

ota:
  - platform: esphome
    port: 3233
    password: !secret ota_password

i2c:
  - id: i2c_bus
    scan: true
    emulation:
      - address: 0x76
        registers:
          # Chip ID -- must be 0x60 or setup() aborts
          0xD0: 0x60
          # Temperature calibration (little-endian uint16/int16)
          # T1=27504 T2=26435 T3=-1000
          0x88: [[0x70, 0x6B]]
          0x8A: [[0x43, 0x67]]
          0x8C: [[0x18, 0xFC]]
          # Pressure calibration
          # P1=36477 P2=-10685 P3=3024 P4=2855 P5=140 P6=-7 P7=15500 P8=-14600 P9=6000
          0x8E: [[0x7D, 0x8E]]
          0x90: [[0x43, 0xD6]]
          0x92: [[0xD0, 0x0B]]
          0x94: [[0x27, 0x0B]]
          0x96: [[0x8C, 0x00]]
          0x98: [[0xF9, 0xFF]]
          0x9A: [[0x8C, 0x3C]]
          0x9C: [[0xF8, 0xC6]]
          0x9E: [[0x70, 0x17]]
          # Humidity calibration
          # H1=75 H2=370 H3=0 H4=312 H5=50 H6=30
          0xA1: 0x4B
          0xE1: [[0x72, 0x01]]
          0xE3: 0x00
          0xE4: 0x13
          0xE5: 0x28
          0xE6: 0x03
          0xE7: 0x1E
          # Control registers
          0xF2: 0x00
          0xF3: 0x00
          0xF5: 0x00
          # Raw measurement burst (0xF7..0xFE): cycles through 3 readings
          #   ~25.1 C  ~1006.8 hPa  ~51.5 %RH
          #   ~20.0 C  ~950.0 hPa   ~35.0 %RH
          #   ~30.0 C  ~1013.0 hPa  ~65.0 %RH
          0xF7:
            - [0x65, 0x52, 0xC0, 0x7E, 0xED, 0x00, 0x71, 0xB8]
            - [0x6C, 0x4F, 0x00, 0x7A, 0xF7, 0xB0, 0x66, 0x5E]
            - [0x65, 0x82, 0xC0, 0x82, 0xC2, 0x80, 0x7A, 0xCE]

sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "Temperature"
    pressure:
      name: "Pressure"
    humidity:
      name: "Humidity"
    update_interval: 10s

  - platform: adc
    id: adc_emulated_sensor
    name: ADC Emulated sensor
    pin: GPIO1 #ignored
    update_interval: 10s
    samples: 3
    sampling_mode: avg
    emulation:
      - [100mV, 500mV, 900mV]
      - [200mV, 200mV, 200mV]
      - [0mV, 1000mV, 2000mV]


debug:
  update_interval: 60s
