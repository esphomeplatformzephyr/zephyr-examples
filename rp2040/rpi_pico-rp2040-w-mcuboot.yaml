esphome:
  name: test-rp2040-w-mcuboot

zephyr:
  variant: rp2040
  board: rpi_pico/rp2040/w/mcuboot
  advanced:
    bootloader: mcuboot

logger:
  level: DEBUG

wifi:
#  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  min_rssi: -40

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
