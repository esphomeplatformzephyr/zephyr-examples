esphome:
  name: rp2040-zero-example

zephyr:
  variant: rp2040
  board: rp2040_zero
  log_level: INFO
  overlays:
    app: |
      &code_partition {
          reg = <0x100 0x1F0000>;
      };

      &flash0 {
          partitions {
              storage_partition: partition@1F0100 {
                  compatible = "zephyr,mapped-partition";
                  label = "storage";
                  reg = <0x1F0100 0xFF00>;
              };
          };
      };

logger:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
