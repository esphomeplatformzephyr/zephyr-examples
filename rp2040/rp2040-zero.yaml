esphome:
  name: rp2040-zero-example

zephyr:
  variant: rp2040
  board: rp2040_zero
  log_level: INFO
  overlays:
    app: |
      &code_partition {
          reg = <0x0 0x0>;
      };

      &flash0 {
          partitions {
              boot_partition: partition@100 {
                  label = "mcuboot";
                  reg = <0x100 0xFF00>;
                  read-only;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0xF0000>;
              };
              slot1_partition: partition@100000 {
                  label = "image-1";
                  reg = <0x100000 0xF0000>;
              };
              storage_partition: partition@1F0000 {
                  compatible = "zephyr,mapped-partition";
                  label = "storage";
                  reg = <0x1F0000 0x10000>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &slot0_partition;
          };
      };
    mcuboot: |
      &code_partition {
          reg = <0x0 0x0>;
      };

      &flash0 {
          partitions {
              boot_partition: partition@100 {
                  label = "mcuboot";
                  reg = <0x100 0xFF00>;
                  read-only;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0xF0000>;
              };
              slot1_partition: partition@100000 {
                  label = "image-1";
                  reg = <0x100000 0xF0000>;
              };
              storage_partition: partition@1F0000 {
                  compatible = "zephyr,mapped-partition";
                  label = "storage";
                  reg = <0x1F0000 0x10000>;
              };
          };
      };

logger:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
