esphome:
  name: esp32c5-wifi-example

zephyr:
  variant: ESP32C5
  snippets:
    - espressif-flash-4M

logger:
  level: VERBOSE
  #hardware_uart: UART0 # monitor via UART pins

wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
