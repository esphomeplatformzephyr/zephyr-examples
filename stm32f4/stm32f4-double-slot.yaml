esphome:
  name: stm32f4-double-slot

zephyr:
  variant: STM32F4
  board: blackpill_f411ce
  # Sector 0:        0 –   16,384  (0x00000 – 0x04000)    (16KB)
  # Sector 1:   16,384 –   32,768  (0x04000 – 0x08000)    (16KB)
  # Sector 2:   32,768 –   49,152  (0x08000 – 0x0C000)    (16KB)
  # Sector 3:   49,152 –   65,536  (0x0C000 – 0x10000)    (16KB)
  # Sector 4:   65,536 –  131,072  (0x10000 – 0x20000)    (64KB)
  # Sector 5:  131,072 –  262,144  (0x20000 – 0x40000)   (128KB)
  # Sector 6:  262,144 –  393,216  (0x40000 – 0x60000)   (128KB)
  # Sector 7:  393,216 –  524,288  (0x60000 – 0x80000)   (128KB)
  # storage_partition sector size is capped at 65,535B (Zephyr's settings_nvs.c) --
  # sectors 2-3 are the only ones free past boot_partition. The board's own dts
  # (boards/weact/blackpill_f411ce/blackpill_f411ce.dts) already lays out
  # slot0_partition/slot1_partition/scratch_partition across sectors 5-7, so
  # those are left untouched here -- only storage_partition is added, into
  # sectors 2-3.
  overlays:
    app: |
      &flash0 {
        partitions {
          storage_partition: partition@8000 {
            label = "storage";
            reg = <0x00008000 0x00008000>;
          };
        };
      };

      / {
        chosen {
          zephyr,code-partition = &slot0_partition;
        };
      };
    mcuboot: |
      &flash0 {
        partitions {
          storage_partition: partition@8000 {
            label = "storage";
            reg = <0x00008000 0x00008000>;
          };
        };
      };

logger:
  hardware_uart: USB_CDC

output:
  - platform: gpio
    id: led_output
    pin:
      number: PC13
      inverted: true

interval:
  - interval: 1s
    then:
      - output.turn_on: led_output
      - delay: 500ms
      - output.turn_off: led_output
