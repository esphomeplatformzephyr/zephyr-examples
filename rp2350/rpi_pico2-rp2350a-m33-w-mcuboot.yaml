esphome:
  name: test-rp2350-w-mcuboot

rp2:
  variant: rp2350
  board: rpi_pico2/rp2350a/m33/w/mcuboot
  framework:
    type: zephyr
    advanced:
      bootloader: mcuboot

logger:
  level: DEBUG

wifi:
#  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  min_rssi: -40

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
