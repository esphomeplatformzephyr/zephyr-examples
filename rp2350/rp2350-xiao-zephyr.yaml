esphome:
  name: test-rp2350-xiao-zephyr

rp2:
  variant: rp2350
  board: xiao_rp2350
  framework:
    type: zephyr
    # The board's single 2MB code partition leaves no room for storage; split it.
    overlays:
      app: |
        &code_partition {
            reg = <0x0 DT_SIZE_M(1)>;
        };

        &flash0 {
            partitions {
                storage_partition: partition@100000 {
                    compatible = "zephyr,mapped-partition";
                    label = "storage";
                    reg = <0x100000 DT_SIZE_M(1)>;
                };
            };
        };

logger:
  level: VERBOSE

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
