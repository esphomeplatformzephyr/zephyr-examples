esphome:
  name: test-rp2350-w

rp2:
  variant: rp2350
  board: rpi_pico2/rp2350a/m33/w
  framework:
    type: zephyr
    overlays:
      app: |
        &flash0 {
            partitions {
                code_partition: partition@0 {
                    reg = <0x0 0x3F0000>;
                };
                storage_partition: partition@3F0000 {
                    compatible = "zephyr,mapped-partition";
                    label = "storage";
                    reg = <0x3F0000 0x10000>;
                };
            };
        };

logger:
  level: DEBUG

wifi:
#  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  min_rssi: -40

api:
  encryption:
    key: !secret api_encryption_key

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
