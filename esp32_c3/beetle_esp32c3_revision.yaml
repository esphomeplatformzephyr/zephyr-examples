# Example showing zephyr: board: 's "@<revision>" syntax (issue #49) against a real
# upstream board with genuine hardware revisions: DFRobot's Beetle ESP32-C3
# (boards/dfrobot/beetle_esp32c3/board.yml declares 1.0.0/2.0.0). @2.0.0 pulls in
# that board's real revision-specific overlay (adds a BOOT button GPIO/alias) on top
# of the base board devicetree.
esphome:
  name: beetle-esp32c3-revision-example

zephyr:
  variant: ESP32C3
  board: beetle_esp32c3@2.0.0
  # pick up mDNS that isn't in a release yet
  framework:
    source:
      type: git
      url: https://github.com/zephyrproject-rtos/zephyr
      ref: main
    refresh: 60min
  kconfig_options:
    CONFIG_MDNS_RESPONDER_ANNOUNCE_DNS_SD: true

logger:
  level: VERBOSE
  #hardware_uart: UART0 # monitor via UART pins

wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:

ota:
  - platform: esphome
    password: !secret ota_password

binary_sensor:
  # GPIO0 pin 9 -- the BOOT button the @2.0.0 revision overlay adds
  # (buttons { boot_button: button0 { gpios = <&gpio0 9 ...>; ... }; };).
  - platform: gpio
    name: "Boot Button"
    pin:
      number: 9
      inverted: true

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
