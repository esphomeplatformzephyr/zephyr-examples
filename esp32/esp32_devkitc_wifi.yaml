esphome:
  name: esp32-wifi-example

esp32:
  variant: ESP32
  framework:
    type: zephyr
    kconfig_options:
      CONFIG_ESP32_REGION_1_NOINIT: true

logger:

network:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
