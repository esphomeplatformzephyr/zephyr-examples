esphome:
  name: esp32-wifi-example

zephyr:
  variant: ESP32
  framework:
    source:
      type: git
      ref: main

logger:

network:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    swap_method: offset
    encryption:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
