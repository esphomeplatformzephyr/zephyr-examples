esphome:
  name: arduino-uno-r4

zephyr:
  variant: RA4M1
  board: arduino_uno_r4@wifi
  # Carve out the storage_partition needed for preferences
  overlays:
    app: |
      &flash0 {
          partitions {
              compatible = "fixed-partitions";
              #address-cells = <1>;
              #size-cells = <1>;

              code_partition: partition@4000 {
                  label = "code";
                  reg = <0x4000 0x3a000>;
                  read-only;
              };

              storage_partition: partition@3e000 {
                  label = "storage";
                  reg = <0x3e000 0x2000>;
              };
          };
      };

logger:
  # default console is UART0 = &uart2 -- no hardware_uart override needed.
  level: VERBOSE

output:
  # board's own led0 alias -- Arduino header D13, ioport1 pin 2 (P102).
  - platform: gpio
    id: led_output
    pin: P102

interval:
  - interval: 3s
    then:
      - logger.log: "interval tick"
      - output.turn_on: led_output
      - delay: 2s
      - output.turn_off: led_output

i2c:
# &iic0 -  Qwiic connector
# &iic1 SCL1 = P100, SDA1 = P101
  dts_node_override: iic1
  scan: false

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "BME280 Temperature"
    pressure:
      name: "BME280 Pressure"
    humidity:
      name: "BME280 Humidity"
    update_interval: 60s
