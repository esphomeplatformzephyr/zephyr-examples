esphome:
  name: arduino-nano-r4

zephyr:
  variant: RA4M1
  board: arduino_nano_r4
  # Carve out the storage_partition needed for preferences
  overlays:
    app: |
      &code_flash {
          partitions {
              ranges;
              #address-cells = <1>;
              #size-cells = <1>;

              code_partition: partition@4000 {
                  compatible = "zephyr,mapped-partition";
                  label = "code";
                  reg = <0x4000 0x3a000>;
                  read-only;
              };

              storage_partition: partition@3e000 {
                  compatible = "zephyr,mapped-partition";
                  label = "storage";
                  reg = <0x3e000 0x2000>;
              };
          };
      };

# Default is UART0=&uart2
logger:

output:
  - platform: gpio
    id: led_output
    pin: P204

interval:
  - interval: 3s
    then:
      - logger.log: "interval tick"
      - output.turn_on: led_output
      - delay: 2s
      - output.turn_off: led_output
