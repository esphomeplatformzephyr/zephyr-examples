esphome:
  name: nrf54lm20dk-example

zephyr:
  variant: nrf54lm20a

network:
  enable_ipv6: true

openthread:
  device_type: mtd
  force_dataset: true
  tlv: !secret openthread_tlv_wed

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

logger:

switch:
  - platform: gpio
    id: led0
    name: "LED0"
    pin:
      number: 54  # led0 on the nRF54LM20 DK: gpio1 pin 22 (1*32 + 22)
      # nrf54lm20dk_common.dtsi: GPIO_ACTIVE_HIGH -- no inverted: needed

interval:
  - interval: 500ms
    then:
      - switch.toggle: led0
