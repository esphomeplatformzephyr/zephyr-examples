esphome:
  name: xiao-nrf54lm20a-example

zephyr:
  variant: nrf54lm20a
  board: xiao_nrf54lm20a
  framework:
    type: zephyr
    source:
      type: git
      ref: main
  # This board's devicetree marks its I2C buses, PMIC (nPM1300, via MFD), and fixed
  # regulator "okay" unconditionally, which Kconfig auto-selects into every image built
  # against this board -- including mcuboot's own minimal (no-multithreading) one, where
  # those drivers fail to link (they need CONFIG_MULTITHREADING). mcuboot itself never
  # touches them, so turn them back off for that image specifically.
  kconfig_options:
    mcuboot:
      I2C: false
      REGULATOR: false
      MFD: false

network:
  enable_ipv6: true

openthread:
  device_type: mtd
  force_dataset: true
  tlv: !secret openthread_tlv_wed

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

logger:

switch:
  - platform: gpio
    id: led0
    name: "LED0 Blue"
    pin:
      number: 55  # blue_led on the XIAO nRF54LM20A: gpio1 pin 23 (1*32 + 23)
      inverted: true  # GPIO_ACTIVE_LOW in the board's own devicetree

interval:
  - interval: 500ms
    then:
      - switch.toggle: led0
