esphome:
  name: xg24-ek2703a-openthread-example

silabs:
  variant: efr32mg24

logger:

network:
  enable_ipv6: true

openthread:
  device_type: mtd
  force_dataset: true
  tlv: !secret openthread_tlv

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

output:
  - platform: gpio
    id: led0_output
    pin: PA4  # LED0

switch:
  - platform: output
    id: led0
    name: "LED0"
    output: led0_output

binary_sensor:
  - platform: gpio
    id: btn0
    name: "BTN0"
    pin:
      number: PB2  # SW0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: led0
