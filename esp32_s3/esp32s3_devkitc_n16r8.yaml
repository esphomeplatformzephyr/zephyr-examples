esphome:
  name: test-esps3

esp32:
  variant: ESP32S3
  framework:
    type: zephyr
    # N16R8 module: 16MB flash, 8MB octal PSRAM.
    snippets:
      - espressif-flash-16M
      - espressif-psram-8M
    kconfig_options:
      # psram-8M defaults to quad mode; the R8 PSRAM is octal.
      # With octal PSRAM, GPIO 33–37 are taken by the PSRAM, no enforcement right now.
      # Should extend PSRAM component instead of manually setting (todo)
      CONFIG_SPIRAM_MODE_OCT: true

logger:
  level: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

button:
  - platform: restart
    name: "Restart"

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
