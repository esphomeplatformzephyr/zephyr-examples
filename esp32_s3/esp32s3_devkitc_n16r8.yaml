esphome:
  name: test-esps3

zephyr:
  variant: ESP32S3
  framework:
    version: 4.5.0-rc1
  # N16R8 module: 16MB flash, 8MB octal PSRAM.
  snippets:
    - espressif-flash-16M
    - espressif-psram-8M
  kconfig_options:
    CONFIG_MDNS_RESPONDER_ANNOUNCE_DNS_SD: true
    # psram-8M defaults to quad mode; the R8 PSRAM is octal.
    # With octal PSRAM, GPIO 33–37 are taken by the PSRAM, no enforcement right now.
    # Should extend PSRAM component instead of manually setting (todo)
    CONFIG_SPIRAM_MODE_OCT: true

logger:
  level: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
    swap_method: offset

button:
  - platform: restart
    name: "Restart"

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
