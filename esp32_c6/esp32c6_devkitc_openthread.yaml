esphome:
  name: esp32c6-openthread-example

esp32:
  variant: ESP32C6
  framework:
    type: zephyr
    snippets:
      - espressif-flash-4M

logger:
  level: VERBOSE
  #hardware_uart: UART0 # monitor via UART pins

network:
  enable_ipv6: true

openthread:
  device_type: mtd
  force_dataset: true
  tlv: !secret openthread_tlv
  output_power: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor_id
    type: seconds
    update_interval: 60s
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
